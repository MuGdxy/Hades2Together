name: test

on:
  push:
  pull_request:

jobs:
  lua:
    name: Phase 0 rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run tests
        run: lua5.4 tests/run.lua
