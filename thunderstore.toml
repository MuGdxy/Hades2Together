[config]
schemaVersion = "0.0.1"

[package]
namespace = "MuGdxy"
name = "Hades2Together"
versionNumber = "0.0.1"
description = "Shared-world online play for Hades II. One authoritative game, up to four players, the same enemies."
websiteUrl = "https://github.com/MuGdxy/Hades2Together"
containsNsfwContent = false

[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.112"
LuaENVY-ENVY = "1.2.0"
SGG_Modding-Chalk = "2.1.2"
SGG_Modding-ReLoad = "1.0.3"
SGG_Modding-ModUtil = "4.0.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./src"
target = "./plugins"

[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii" ]

[publish.categories]
hades-ii = [ "mods" ]
