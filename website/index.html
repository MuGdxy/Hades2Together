<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="" data-copy="description" data-attribute="content">
  <meta name="theme-color" content="#101613">
  <title data-copy="title">Hades2Together</title>
  <link rel="stylesheet" href="./assets/site.css">
  <script type="module" src="./assets/site.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-copy="skip"></a>
  <header class="site-header">
    <div class="frame header-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"></span>
        <span data-copy="brand"></span>
      </a>
      <nav aria-label="" data-copy="navigation" data-attribute="aria-label">
        <a href="#download" data-copy="navDownload"></a>
        <a href="#guide" data-copy="navGuide"></a>
      </nav>
      <div class="languages" role="group" aria-label="" data-copy="languageLabel" data-attribute="aria-label">
        <button type="button" lang="en" data-language="en" data-copy="english" aria-pressed="false"></button>
        <button type="button" lang="zh-CN" data-language="zh-CN" data-copy="chinese" aria-pressed="false"></button>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section class="hero" aria-labelledby="hero-title">
      <div class="frame hero-inner">
        <p class="eyebrow" data-copy="heroLabel"></p>
        <h1 id="hero-title">
          <span data-copy="heroLineOne"></span>
          <span data-copy="heroLineTwo"></span>
        </h1>
        <p class="hero-description" data-copy="heroDescription"></p>
        <a class="button button-primary" href="#download" data-copy="heroAction"></a>
      </div>
    </section>
    <div class="frame content">
      <section id="download" class="download" aria-labelledby="download-title">
        <div class="download-main">
          <p class="eyebrow" data-copy="downloadLabel"></p>
          <h2 id="download-title" data-copy="downloadTitle"></h2>
          <div class="release-status" role="status" aria-atomic="true">
            <p class="release-title" id="release-title"></p>
            <p class="release-detail" id="release-detail"></p>
          </div>
          <div class="release-actions">
            <a id="installer-link" class="button button-primary" data-copy="downloadAction" hidden></a>
            <a class="button button-secondary" href="https://github.com/MuGdxy/Hades2Together/releases" data-copy="releasesAction"></a>
          </div>
        </div>
        <aside class="compatibility" aria-labelledby="compatibility-title">
          <h3 id="compatibility-title" data-copy="compatibilityTitle"></h3>
          <dl>
            <div><dt data-copy="platformLabel"></dt><dd data-copy="platformValue"></dd></div>
            <div><dt data-copy="gameLabel"></dt><dd data-copy="gameValue"></dd></div>
            <div><dt data-copy="savesLabel"></dt><dd data-copy="savesValue"></dd></div>
          </dl>
          <p data-copy="previewScope"></p>
        </aside>
      </section>
      <section id="guide" class="guide" aria-labelledby="guide-title">
        <h2 id="guide-title" data-copy="guideTitle"></h2>
        <div class="guide-grid">
          <section class="guide-card" aria-labelledby="install-title">
            <h3 id="install-title" data-copy="installTitle"></h3>
            <ol>
              <li data-copy="installDownload"></li>
              <li data-copy="installChoose"></li>
              <li data-copy="installLaunch"></li>
            </ol>
          </section>
          <section class="guide-card" aria-labelledby="uninstall-title">
            <h3 id="uninstall-title" data-copy="uninstallTitle"></h3>
            <ol>
              <li data-copy="uninstallClose"></li>
              <li data-copy="uninstallSettings"></li>
              <li data-copy="uninstallConfirm"></li>
            </ol>
          </section>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="frame footer-inner">
      <p data-copy="footer"></p>
      <a href="https://github.com/MuGdxy/Hades2Together" data-copy="sourceAction"></a>
    </div>
  </footer>
</body>
</html>
